<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla TV - Vérification et Redirection...</title>
    <meta name="description" content="Tesla TV - Plein écran dans votre voiture.">
    
    <style>
        body {
            background-color: #0a0e17;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        
        .loader-container {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 25px;
        }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: spin 1s linear infinite;
            box-sizing: border-box;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        h2 {
            margin: 0 0 15px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .status { 
            color: #aaa; 
            font-size: 1em; 
            margin-bottom: 40px;
            min-height: 20px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .manual-btn {
            color: #00d9ff;
            text-decoration: none;
            border: 1px solid rgba(0, 217, 255, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            background: rgba(0, 217, 255, 0.05);
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .manual-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4d4d;
            margin-top: 20px;
            display: none;
        }
    </style>

    <script>
        // Configuration des serveurs (sans slash à la fin pour la concaténation propre)
        const SERVEURS = [
            "https://moonlit-hotteok-34b5d9.netlify.app",
            "https://teslatv01.netlify.app",
            "https://jade-pothos-995e5e.netlify.app"
        ];

        const FICHIER_TEST = "favicon.ico"; // Doit exister sur les serveurs
        const TEMPS_MAX = 3000; // ms

        let indexServeur = 0;

        function lancerTest(index) {
            if (index >= SERVEURS.length) {
                // Tous les serveurs ont échoué
                afficherErreur();
                return;
            }

            const serveur = SERVEURS[index];
            const statusText = document.getElementById("status-text");
            statusText.innerText = `Vérification du serveur ${index + 1}...`;

            const img = new Image();
            // Ajout d'un timestamp pour éviter le cache
            const urlTest = `${serveur}/${FICHIER_TEST}?t=${Date.now()}`;
            
            //计时器用于强制重定向
            const timeoutId = setTimeout(() => {
                console.log(`Timeout pour ${serveur}, tentative de redirection...`);
                // 即使图片没有完成，我们也尝试跳转
                window.location.href = serveur;
            }, TEMPS_MAX);

            img.onload = function() {
                clearTimeout(timeoutId);
                statusText.innerText = "Connexion réussie ! Redirection...";
                window.location.href = serveur;
            };

            img.onerror = function() {
                clearTimeout(timeoutId);
                console.log(`${serveur} indisponible.`);
                // Essayer le suivant
                lancerTest(index + 1);
            };

            img.src = urlTest;
        }

        function afficherErreur() {
            const statusText = document.getElementById("status-text");
            const btnContainer = document.querySelector('.buttons-container');
            
            statusText.innerText = "Tous les serveurs semblent indisponibles.";
            statusText.style.color = "#ffca28";
            
            // On cache le loader car on affiche les boutons manuels
            document.querySelector('.loader').style.display = 'none';
            
            // On affiche les boutons manuels
            btnContainer.style.display = 'flex';
            
            // On cache le texte "Si rien ne se passe" car les boutons sont déjà là
            document.querySelector('.footer-text').style.display = 'none';
        }

        // Démarrage
        window.onload = function() {
            // Une petite pause de 500ms pour l'UX (pour voir le loader)
            setTimeout(() => {
                lancerTest(0);
            }, 500);
        };
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
    </div>
    
    <h2>Lancement de Tesla TV</h2>
    <p id="status-text" class="status">Initialisation...</p>
    
    <div class="buttons-container" style="display: none;">
        <p class="footer-text" style="margin-top:30px; color:#666; font-size:0.9em;">Si la redirection automatique échoue :</p>
        
        <a href="https://moonlit-hotteok-34b5d9.netlify.app/" class="manual-btn">Serveur Principal</a>
        <a href="https://teslatv01.netlify.app/" class="manual-btn">Secours 1</a>
        <a href="https://jade-pothos-995e5e.netlify.app/" class="manual-btn">Secours 2</a>
    </div>

    <div id="error-details" class="error-message">
        Vérifiez votre connexion internet.
    </div>
</body>
</html>
