<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla TV - Vérification et Redirection...</title>

    <!-- =========================== -->
    <!-- SEO & PARTAGE SOCIAL        -->
    <!-- =========================== -->
    <meta name="description" content="Profitez de Tesla TV en plein écran dans votre voiture. Streaming de chaînes TV en direct et guide TV optimisés pour le navigateur Tesla.">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Tesla TV - Regardez la TV en direct dans votre Tesla">
    <meta property="og:description" content="Profitez d'une expérience plein écran sur votre navigateur Tesla. Accédez gratuitement à vos chaînes TV en direct.">
    <meta property="og:url" content="https://mikefri.github.io/Teslatv/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://mikefri.github.io/Teslatv/image-preview.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://mikefri.github.io/Teslatv/image-preview.jpg">

    <!-- =========================== -->
    <!-- FAVICONS & ICONS            -->
    <!-- =========================== -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    
    <!-- Styles -->
    <style>
        body {
            background-color: #0a0e17;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #00d9ff; text-decoration: none; border: 1px solid #00d9ff; padding: 10px 20px; border-radius: 5px; margin-top: 10px; display: inline-block;}
        .status { margin-bottom: 20px; color: #aaa; font-size: 0.9em; }
    </style>

    <!-- =========================== -->
    <!-- LOGIQUE DE REDIRECTION      -->
    <!-- =========================== -->
    <script type="text/javascript">
        // 1. Définir vos 3 liens
        const LIEN_PRINCIPAL = "https://moonlit-hotteok-34b5d9.netlify.app/";
        const LIEN_SECOURS_1 = "https://teslatv01.netlify.app/"; 
        const LIEN_SECOURS_2 = "https://jade-pothos-995e5e.netlify.app//"; // REMPLACEZ PAR VOTRE 3ème LIEN
        
        // Fichier témoin à tester (doit exister sur chaque site)
        const FICHIER_TEST = "favicon.ico"; 

        // Fonction pour tester un lien
        function testLink(url, successCallback, failCallback) {
            var img = new Image();
            img.src = url + FICHIER_TEST + "?t=" + new Date().getTime();
            
            img.onload = successCallback;
            img.onerror = failCallback;
            
            // Timeout de sécurité (3 secondes)
            setTimeout(function() {
                if(!img.complete) {
                    failCallback();
                }
            }, 3000);
        }

        function checkAndRedirect() {
            var statusText = document.getElementById("status-text");
            
            // ÉTAPE 1 : Tester le lien principal
            statusText.innerText = "Test du serveur principal...";
            
            testLink(
                LIEN_PRINCIPAL,
                // Si le principal fonctionne
                function() {
                    statusText.innerText = "Serveur principal OK. Lancement...";
                    window.location.href = LIEN_PRINCIPAL;
                },
                // Si le principal échoue, tester le secours 1
                function() {
                    console.log("Site principal indisponible, test du secours 1...");
                    statusText.innerText = "Principal indisponible. Test du serveur de secours 1...";
                    
                    testLink(
                        LIEN_SECOURS_1,
                        // Si le secours 1 fonctionne
                        function() {
                            statusText.innerText = "Serveur de secours 1 OK. Redirection...";
                            window.location.href = LIEN_SECOURS_1;
                        },
                        // Si le secours 1 échoue, tester le secours 2
                        function() {
                            console.log("Secours 1 indisponible, test du secours 2...");
                            statusText.innerText = "Secours 1 indisponible. Test du serveur de secours 2...";
                            
                            testLink(
                                LIEN_SECOURS_2,
                                // Si le secours 2 fonctionne
                                function() {
                                    statusText.innerText = "Serveur de secours 2 OK. Redirection...";
                                    window.location.href = LIEN_SECOURS_2;
                                },
                                // Si tous échouent, retour au principal par défaut
                                function() {
                                    console.log("Tous les serveurs semblent indisponibles. Tentative sur le principal...");
                                    statusText.innerText = "Aucun serveur disponible. Tentative sur le principal...";
                                    window.location.href = LIEN_PRINCIPAL;
                                }
                            );
                        }
                    );
                }
            );
        }

        // Lancer la vérification au chargement
        window.onload = checkAndRedirect;
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2>Lancement de Tesla TV</h2>
    <p id="status-text" class="status">Initialisation...</p>
    
    <div style="margin-top: 30px;">
        <p>Si rien ne se passe, cliquez sur un lien :</p>
        <a href="https://moonlit-hotteok-34b5d9.netlify.app/">Lien Principal</a>
        <br><br>
        <a href="https://teslatv01.netlify.app/">Lien de Secours 1</a>
        <br><br>
        <a href="https://jade-pothos-995e5e.netlify.app//">Lien de Secours 2</a>
    </div>
</body>
</html>
