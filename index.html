<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla TV - Vérification et Redirection...</title>
    <meta name="description" content="Tesla TV - Plein écran dans votre voiture.">
    
    <style>
        body {
            background-color: #0a0e17;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
            overflow: hidden;
        }
        
        .loader-container {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 25px;
        }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: spin 1s linear infinite;
            box-sizing: border-box;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        h2 {
            margin: 0 0 15px 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .status { 
            color: #aaa; 
            font-size: 1em; 
            margin-bottom: 40px;
            min-height: 20px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .manual-btn {
            color: #00d9ff;
            text-decoration: none;
            border: 1px solid rgba(0, 217, 255, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            background: rgba(0, 217, 255, 0.05);
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .manual-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4d4d;
            margin-top: 20px;
            display: none;
        }
    </style>

    <script>
const TARGET = "https://teslatv01.vercel.app/";

document.addEventListener("DOMContentLoaded", () => {
  const statusText = document.getElementById("status-text");
  statusText.textContent = "Redirection...";
  window.location.replace(TARGET);
});
</script>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
    </div>
    
    <h2>Lancement de Tesla TV</h2>
    <p id="status-text" class="status">Initialisation...</p>
    
    <div class="buttons-container">
        <p class="footer-text" style="margin-top:30px; color:#666; font-size:0.9em;">Si la redirection automatique échoue :</p>
        <a href="https://teslatv01.vercel.app/" class="manual-btn">Serveur Principal</a>
    </div>

    <div id="error-details" class="error-message">
        Vérifiez votre connexion internet.
    </div>
</body>
</html>
