<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla TV - Vérification et Redirection...</title>

    <!-- =========================== -->
    <!-- SEO & PARTAGE SOCIAL        -->
    <!-- =========================== -->
    <meta name="description" content="Profitez de Tesla TV en plein écran dans votre voiture. Streaming de chaînes TV en direct et guide TV optimisés pour le navigateur Tesla.">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Tesla TV - Regardez la TV en direct dans votre Tesla">
    <meta property="og:description" content="Profitez d'une expérience plein écran sur votre navigateur Tesla. Accédez gratuitement à vos chaînes TV en direct.">
    <meta property="og:url" content="https://mikefri.github.io/Teslatv/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://mikefri.github.io/Teslatv/image-preview.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://mikefri.github.io/Teslatv/image-preview.jpg">

    <!-- =========================== -->
    <!-- FAVICONS & ICONS            -->
    <!-- =========================== -->
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    
    <!-- Styles -->
    <style>
        body {
            background-color: #0a0e17;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #00d9ff; text-decoration: none; border: 1px solid #00d9ff; padding: 10px 20px; border-radius: 5px; margin-top: 10px; display: inline-block;}
        .status { margin-bottom: 20px; color: #aaa; font-size: 0.9em; }
    </style>

    <!-- =========================== -->
    <!-- LOGIQUE DE REDIRECTION      -->
    <!-- =========================== -->
    <script type="text/javascript">
        // 1. Définir vos 3 liens
        const LIEN_PRINCIPAL = "https://moonlit-hotteok-34b5d9.netlify.app/";
        const LIEN_SECOURS_1 = "https://teslatv01.netlify.app/"; 
        const LIEN_SECOURS_2 = "https://jade-pothos-995e5e.netlify.app/"; // REMPLACEZ PAR VOTRE 3ème LIEN
        
        // Fichier témoin à tester (doit exister sur le site principal)
        const FICHIER_TEST = "favicon.ico"; 

        function checkAndRedirect() {
            var statusText = document.getElementById("status-text");
            statusText.innerText = "Test de la connexion au serveur principal...";

            var img = new Image();
            
            // On ajoute un timestamp pour éviter que le navigateur utilise le cache
            img.src = LIEN_PRINCIPAL + FICHIER_TEST + "?t=" + new Date().getTime();

            // CAS 1 : Le site principal fonctionne (l'image a chargé)
            img.onload = function() {
                statusText.innerText = "Connexion établie. Lancement...";
                window.location.href = LIEN_PRINCIPAL;
            };

            // CAS 2 : Le site principal est HS (l'image n'a pas chargé)
            img.onerror = function() {
                console.log("Site principal indisponible, test du secours 1...");
                statusText.innerText = "Principal indisponible. Test du secours 1...";
                
                // Tester le secours 1
                var img2 = new Image();
                img2.src = LIEN_SECOURS_1 + FICHIER_TEST + "?t=" + new Date().getTime();
                
                // Le secours 1 fonctionne
                img2.onload = function() {
                    statusText.innerText = "Secours 1 OK. Redirection...";
                    window.location.href = LIEN_SECOURS_1;
                };
                
                // Le secours 1 est HS aussi
                img2.onerror = function() {
                    console.log("Secours 1 indisponible, test du secours 2...");
                    statusText.innerText = "Secours 1 indisponible. Test du secours 2...";
                    
                    // Tester le secours 2
                    var img3 = new Image();
                    img3.src = LIEN_SECOURS_2 + FICHIER_TEST + "?t=" + new Date().getTime();
                    
                    // Le secours 2 fonctionne
                    img3.onload = function() {
                        statusText.innerText = "Secours 2 OK. Redirection...";
                        window.location.href = LIEN_SECOURS_2;
                    };
                    
                    // Tous les sites sont HS
                    img3.onerror = function() {
                        console.log("Tous les serveurs indisponibles, tentative sur le principal...");
                        statusText.innerText = "Tous indisponibles. Tentative sur le principal...";
                        window.location.href = LIEN_PRINCIPAL;
                    };
                    
                    // Sécurité pour img3 : Si rien après 3 secondes, forcer le secours 2
                    setTimeout(function() {
                        if(!img3.complete) {
                            window.location.href = LIEN_SECOURS_2;
                        }
                    }, 3000);
                };
                
                // Sécurité pour img2 : Si rien après 3 secondes, forcer le secours 1
                setTimeout(function() {
                    if(!img2.complete) {
                        window.location.href = LIEN_SECOURS_1;
                    }
                }, 3000);
            };

            // Sécurité pour img1 : Si rien ne se passe après 3 secondes, on force le principal
            setTimeout(function() {
                if(!img.complete) {
                    window.location.href = LIEN_PRINCIPAL;
                }
            }, 3000);
        }

        // Lancer la vérification au chargement
        window.onload = checkAndRedirect;
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2>Lancement de Tesla TV</h2>
    <p id="status-text" class="status">Initialisation...</p>
    
    <div style="margin-top: 30px;">
        <p>Si rien ne se passe :</p>
        <a href="https://moonlit-hotteok-34b5d9.netlify.app/">Lien Principal</a>
        <br><br>
        <a href="https://teslatv01.netlify.app/">Lien de Secours 1</a>
        <br><br>
        <a href="https://jade-pothos-995e5e.netlify.app/">Lien de Secours 2</a>
    </div>
</body>
</html>
